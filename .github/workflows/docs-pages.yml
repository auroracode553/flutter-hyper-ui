name: Docs Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    name: Create package tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.package_version.outputs.tag_name }}
      tag_created: ${{ steps.create_tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail

          version="$(awk '/^version:/ { print $2; exit }' ui/pubspec.yaml | tr -d "\"'")"
          if [[ -z "$version" ]]; then
            echo "Cannot read version from ui/pubspec.yaml" >&2
            exit 1
          fi

          echo "tag_name=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing
        id: create_tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.package_version.outputs.tag_name }}"
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "Tag ${tag} already exists; skip creating it."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release ${tag}"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build documentation site
    needs:
      - tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter preview dependencies
        working-directory: preview
        run: flutter pub get

      - name: Build Flutter preview
        working-directory: preview
        env:
          PREVIEW_BASE_HREF: ${{ steps.pages.outputs.base_path }}/preview/
        run: flutter build web --release --base-href "$PREVIEW_BASE_HREF"

      - name: Copy preview into VitePress public assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf vitepress/public/preview
          mkdir -p vitepress/public/preview
          cp -R preview/build/web/. vitepress/public/preview/

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vitepress/package-lock.json

      - name: Install VitePress dependencies
        working-directory: vitepress
        run: npm ci

      - name: Build VitePress
        working-directory: vitepress
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_PREVIEW_BASE: ${{ steps.pages.outputs.base_path }}/preview
        run: npm run docs:build

      - name: Disable Jekyll processing
        shell: bash
        run: touch vitepress/.vitepress/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: vitepress/.vitepress/dist

  deploy:
    name: Deploy GitHub Pages
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
